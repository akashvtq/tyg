# TYG vhost. The document root is the project root, so everything except /assets, robots.txt
# and index.php is routed to Laravel (which 404s it) — .env, vendor/, storage/, app/ are never served.
<VirtualHost *:${PORT}>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On

        # Static files: only real files under /assets/, plus robots.txt / favicon.ico
        RewriteCond %{REQUEST_URI} ^/assets/
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^ - [L]
        RewriteCond %{REQUEST_FILENAME} -f
        RewriteRule ^(robots\.txt|favicon\.ico)$ - [L]

        # Laravel front controller handles everything else (pass the Authorization header through)
        RewriteRule ^index\.php$ - [L]
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteRule ^ index.php [L]
    </Directory>

    # Never execute PHP that ends up inside /assets (e.g. a malicious upload)
    <Directory /var/www/html/assets>
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
        <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType image/png "access plus 30 days"
            ExpiresByType image/jpeg "access plus 30 days"
            ExpiresByType image/webp "access plus 30 days"
            ExpiresByType image/svg+xml "access plus 30 days"
            ExpiresByType text/css "access plus 7 days"
            ExpiresByType application/javascript "access plus 7 days"
            ExpiresByType font/woff2 "access plus 30 days"
        </IfModule>
    </Directory>

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
